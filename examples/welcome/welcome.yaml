deck:
  title: Welcome to Datalayer Decks
  subtitle: One YAML file, many ways to tell the story
  template: datalayer
  transition: slide
  footer:
    note: Decks are data

slides:
  - id: welcome
    type: title
    title: Welcome to Datalayer Decks
    subtitle: Presentations described as data, rendered as a polished story
    meta: Run this deck with `make example`

  - id: layouts
    type: section
    title: Start with intent
    subtitle: Pick the semantic layout that matches what the slide needs to say.

  - id: statement
    type: statement
    statement: The specification owns the content. The template owns the pixels.
    attribution: Change one word to change the visual language of the whole deck.

  - id: bullets
    type: bullets
    title: A focused list
    subtitle: Bullets can arrive together or reveal one at a time.
    icon: check
    fragments: true
    items:
      - Write deck content in YAML or TypeScript
      - Reuse semantic layouts across presentations
      - Present, share, and print through Reveal.js

  - id: columns
    type: two-columns
    title: Compose richer slides from blocks
    layout: wide-right
    left:
      type: stack
      heading: The specification
      blocks:
        - type: text
          content: A column can hold text, bullets, metrics, code, images, components, or diagrams.
        - type: metrics
          metrics:
            - value: "1"
              label: portable source file
            - value: "∞"
              label: stories it can tell
    right:
      type: mermaid
      heading: The rendering pipeline
      diagram: |
        flowchart LR
          YAML[Deck YAML] --> V[Validation]
          V --> T[Template]
          T --> R[Reveal.js]

  - id: metrics
    type: metrics
    title: Numbers get room to breathe
    metrics:
      - value: "20+"
        label: semantic slide layouts
        detail: From title to timeline
      - value: "1"
        label: portable specification
        detail: Plain data, easy to version
      - value: "0"
        label: CSS rules in your YAML
        detail: Templates handle presentation

  - id: comparison
    type: comparison
    title: Separate content from presentation
    columns:
      - Hand-built slides
      - Datalayer Decks
    highlight: 1
    rows:
      - label: Content is portable
        values: [false, true]
      - label: Theme can change centrally
        values: [false, true]
      - label: Agent-friendly structured data
        values: [false, true]

  - id: timeline
    type: timeline
    title: From idea to audience
    items:
      - when: "01"
        title: Outline
        detail: Choose the story and its semantic layouts.
      - when: "02"
        title: Specify
        detail: Write portable YAML content.
      - when: "03"
        title: Review
        detail: Serve locally and refine in the browser.
        current: true
      - when: "04"
        title: Present
        detail: Share the URL or print to PDF.

  - id: chart
    type: chart
    title: A chart without a charting dependency
    subtitle: Use semantic bars when the shape of the comparison is the message.
    max: 100
    series:
      - label: Writing content
        value: 85
        display: 85%
      - label: Styling slides
        value: 15
        display: 15%
      - label: Fighting layouts
        value: 2
        display: 2%
    caption: Illustrative values—the welcome deck spends its time on the story.

  - id: process
    type: mermaid
    title: Mermaid is a first-class slide
    subtitle: Put Mermaid source directly in a deck specification.
    diagram: |
      sequenceDiagram
        participant Author
        participant CLI as datalayer decks serve
        participant Deck as Deck renderer
        Author->>CLI: welcome.yaml
        CLI->>Deck: validated specification
        Deck-->>Author: interactive presentation
    caption: Mermaid also works as a block inside column and stack layouts.

  - id: code
    type: code
    title: The command is deliberately small
    language: bash
    code: |
      datalayer decks serve my-deck.yaml
    caption: The CLI imports the YAML into an isolated temporary catalog and opens it directly.

  - id: live
    type: component
    title: And when a slide needs a real component
    subtitle: The spec names it, the host decides what the name means — so a YAML file can hold a live control without holding any code.
    component: LiveAppearance
    notes: |
      The one slide in this deck that cannot be a picture of itself. On the
      left is the appearance chooser from @datalayer/primer-addons, the
      control the Datalayer header wears, bound to the same theme store; on
      the right is SvgAgentsHomeHero from @datalayer/design, reading that
      same store. Pick a theme and the drawing repaints while the room
      watches. The frame around it will not: this deck is on the `datalayer`
      template, whose colours are Primer's own tokens, and the standalone
      shell re-applies those for the colour mode but not for the variant.
      A deck on `datalayer-brand` — the Q2 review example — resolves its
      colours from the palette in JavaScript and repaints end to end, which
      is the better thing to show next if the question comes up.

      The name `LiveAppearance` means something here because the app
      registered it (app/src/App.tsx, registerDeckComponents); a host that
      has not sees the engine's "unknown component" notice instead, and the
      rest of the deck is unaffected.

  - id: pyodide
    type: component
    title: And when the slide needs to run code
    subtitle: A Jupyter cell on a Pyodide kernel — Python running in this tab, with no server behind it.
    component: JupyterPyodideCell
    notes: |
      The cell runs itself: the kernel starts when the slide is first shown,
      `Cell` auto-starts, and the plot lands about fifteen seconds later.
      Fifteen, not five, because the cell installs matplotlib on the way:
      `%pip install` is piplite, fetching the wheel into the browser. Say what
      is happening while it works — `useJupyter({ lite: true })` builds a
      JupyterLite service manager whose kernel is Pyodide, jupyter-react
      carries the kernel extension, the Pyodide runtime comes from the
      jsDelivr CDN, and matplotlib comes from PyPI. The room needs the
      network, and a cold cache costs longer than a warm one. Nothing is
      deployed to run any of it: there is no Jupyter server behind this slide.

      The figure is drawn in the deck's own accent, and the cell in the deck's
      own tokens — JupyterLab's palette is mapped onto the template's in
      app/src/JupyterCellSlide.tsx, because a cell in JupyterLab's greys on a
      Matrix-dark slide is two palettes in one box. The colours are read from
      the deck when the slide starts, so a theme picked *after* that leaves
      the figure as it was drawn; step back and reload to redraw it.

      Reveal keeps every slide of a deck mounted at once, so the kernel is
      deliberately held back until this slide is on screen (an
      IntersectionObserver in app/src/JupyterCellSlide.tsx). Otherwise opening
      the deck at slide one downloaded Pyodide for a reader who never came
      this far. Until then the slide says so rather than pretending to be
      busy.

      Which is also the point worth making out loud. The previous slide showed
      a spec naming a control; this one shows the same mechanism carrying a
      whole runtime, and the deck did not have to learn what a kernel is.
      `JupyterPyodideCell` is registered by this application rather than by
      `@datalayer/decks/examples` (app/src/deckComponents.tsx): JupyterLab,
      Lumino and CodeMirror are a fair thing for a Jupyter host to carry and
      an unfair thing to put in a deck engine, so the host offers the name and
      the spec stays a few lines of YAML. In another host the slide shows the
      engine's "unknown component" notice, and the rest of the deck is fine.

  - id: finish
    type: closing
    title: Now tell your story
    subtitle: Copy this example, change the content, and keep the layouts.
    cta: Run `make example` to begin.
    contact: datalayer.ai
