# Builds and tests both halves on every push and pull request to main: the
# TypeScript package, its plugin, the interface and the Module Federation
# container (what the wheel carries), and the Python package. The reactor is
# checked out beside this repository, because the TypeScript configuration
# resolves `@datalayer/reactor` from `../reactor` (its source for the type
# check and the tests, its built lib/ for the build) — the layout of the
# Datalayer workspace, reproduced here. See release.yaml for the same build
# feeding a release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The reactor checked out beside this repository, as ../reactor. Kept at
  # the release the package floors on (pyproject.toml, package.json).
  REACTOR_REF: v1.0.4

jobs:
  typescript:
    name: TypeScript, interface and container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: decks
      - uses: actions/checkout@v4
        with:
          repository: datalayer/reactor
          ref: ${{ env.REACTOR_REF }}
          path: reactor
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the reactor beside this repository
        working-directory: reactor
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install
        working-directory: decks
        run: npm install --no-audit --no-fund

      - name: Type-check against the reactor source
        working-directory: decks
        run: npm run typecheck

      - name: Build the package (lib/)
        working-directory: decks
        run: npm run build:lib

      - name: Test
        working-directory: decks
        run: npm test

      - name: Build the AI agents plugin
        working-directory: decks/plugins/ai-agents
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build the interface and the container (share/)
        working-directory: decks
        run: |
          (cd app && npm install --no-audit --no-fund)
          npm run app:build
          npm run extension:build
          test -f share/datalayer/reactor/apps/decks/index.html
          test -f share/datalayer/reactor/extensions/decks/remoteEntry.js

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The JavaScript halves are the other job's; an editable install
        # never builds them (hatch_build.py), and the tests do not need them.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests -q
      - name: The command and the entry points
        run: |
          datalayer-decks --help
          python -c "from datalayer_decks import __version__; print(__version__)"
